user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"request_id":"$request_id"}';
  access_log /dev/stdout json; error_log /dev/stderr warn;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  upstream api { server api:8000; keepalive 32; }
  upstream web { server web:3000; keepalive 32; }
  server {
    listen 8080;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
    location / { proxy_pass http://web; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
