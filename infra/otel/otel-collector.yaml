receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
  resource:
    attributes:
      - key: deployment.environment
        action: upsert
        value: trust-soc
exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:9464
service:
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheus] }
    logs: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [debug] }
